name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "remote/**"
      - "extension/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, lite]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project and copy app files
        run: |
          npx --yes create-expo-app@latest build --template blank --no-install
          cp App.js mp.js app.json build/
          cp -r assets build/
          echo "{ \"build\": ${{ github.run_number }}, \"variant\": \"${{ matrix.variant }}\" }" > build/build-info.json

      - name: Full version - native notification listener
        if: matrix.variant == 'full'
        run: cp -r modules build/

      - name: Lite version - separate app, no notification access
        if: matrix.variant == 'lite'
        working-directory: build
        run: |
          mkdir -p modules/mashov-listener
          echo 'export default null;' > modules/mashov-listener/index.js
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("app.json", "utf8"));
            m.expo.name = "משוב פלוס לייט";
            m.expo.slug = "mashov-plus-lite";
            m.expo.android.package = "com.yotamco.mashovplus.lite";
            fs.writeFileSync("app.json", JSON.stringify(m, null, 2));
          '

      - name: Install dependencies
        working-directory: build
        run: |
          npm install
          npx expo install react-native-webview @react-native-async-storage/async-storage react-native-safe-area-context expo-notifications expo-secure-store

      - name: Generate Android project
        working-directory: build
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then N=mashov-plus-lite-build-${{ github.run_number }}.apk; else N=mashov-plus-build-${{ github.run_number }}.apk; fi
          cp build/android/app/build/outputs/apk/release/app-release.apk "$N"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: mashov-plus*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: משוב פלוס (build ${{ github.run_number }})
          body: |
            **mashov-plus-build-${{ github.run_number }}.apk** - הגרסה המלאה, עם התראות מאפליקציית משוב.
            **mashov-plus-lite-build-${{ github.run_number }}.apk** - לייט: בלי גישה להתראות, ולכן Play Protect לא אמור לחסום. מתאים לחברים.
          files: out/*.apk
