name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "remote/**"
      - "extension/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project and copy app files
        run: |
          npx --yes create-expo-app@latest build --template blank --no-install
          cp App.js mp.js app.json build-info.json build/
          cp -r assets build/
          cp -r modules build/
          echo "{ \"build\": ${{ github.run_number }} }" > build/build-info.json

      - name: Install dependencies
        working-directory: build
        run: |
          npm install
          npx expo install react-native-webview @react-native-async-storage/async-storage react-native-safe-area-context expo-notifications

      - name: Generate Android project
        working-directory: build
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mashov-plus-apk
          path: build/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: משוב פלוס (build ${{ github.run_number }})
          files: build/android/app/build/outputs/apk/release/app-release.apk
